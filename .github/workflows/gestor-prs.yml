name: Gestor Automático de PRs de Alumnos

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  procesar-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Evaluar conflictos y procesar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Revisando estado de conflictos del PR #$PR_NUMBER en $REPO..."
          
          MERGEABLE="null"
          INTENTOS=0
          
          while [ "$MERGEABLE" == "null" ] && [ $INTENTOS -lt 12 ]; do
            sleep 5
            MERGEABLE=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.mergeable')
            INTENTOS=$((INTENTOS+1))
          done

          echo "Estado final 'mergeable': $MERGEABLE"

          if [ "$MERGEABLE" == "true" ]; then
            echo "Sin conflictos. Fusionando PR..."
            # Añadimos -R $REPO para decirle exactamente en qué repositorio actuar
            gh pr merge $PR_NUMBER --merge --admin -R $REPO
            
          elif [ "$MERGEABLE" == "false" ]; then
            echo "Conflictos detectados. Cerrando PR..."
            # Añadimos -R $REPO también aquí
            gh pr comment $PR_NUMBER --body "Se ha rechazado tu pull request. Debes asegurarte de sincronizar tu fork del repositorio del profesor justo antes de hacer el pull request." -R $REPO
            gh pr close $PR_NUMBER -R $REPO
            
          else
            echo "No se pudo determinar el estado de los conflictos."
            exit 1
          fi
